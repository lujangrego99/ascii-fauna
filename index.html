<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>New tab</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>

  <!-- refraction map for the liquid glass -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="4" result="n" />
      <feGaussianBlur in="n" stdDeviation="2.5" result="m" />
      <feDisplacementMap in="SourceGraphic" in2="m" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <nav id="tabs" class="glass" aria-label="Animal"></nav>

  <button id="tweaksBtn" class="glass" type="button" aria-expanded="false" aria-controls="tweaks">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    <span data-i18n="settings">Settings</span>
  </button>
  <section id="tweaks" class="glass" hidden>
    <label><span data-i18n="detail">Resolution</span> <input type="range" id="detail" min="1" max="9" step="1"></label>
    <label><span data-i18n="amount">Amount</span> <input type="range" id="amount" min="0.3" max="2" step="0.1"></label>
    <label><span data-i18n="size">Size</span> <input type="range" id="size" min="0.6" max="1.6" step="0.05"></label>
    <label><span data-i18n="speed">Speed</span> <input type="range" id="speed" min="0.3" max="2" step="0.1"></label>
    <label class="check"><input type="checkbox" id="suggestToggle"> <span><span data-i18n="suggest">Search suggestions</span><small data-i18n="suggestHint"></small></span></label>
    <label><span data-i18n="name">Your name</span> <input type="text" id="name" maxlength="24" data-i18n-placeholder="namePlaceholder"></label>
    <footer>
      <a href="https://github.com/lujangrego99/ascii-fauna" target="_blank" rel="noopener" class="gh" title="github.com/lujangrego99/ascii-fauna">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <span id="version"></span>
      <a id="update" target="_blank" rel="noopener" hidden></a>
      <button type="button" id="reset" data-i18n="reset">Reset</button>
    </footer>
  </section>

  <main id="center">
    <div id="clock"></div>
    <h1 id="greet"></h1>
    <form id="search" class="glass" autocomplete="off">
      <div class="field">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <textarea id="q" rows="1" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" data-i18n-placeholder="search" data-i18n-label="searchLabel" autofocus></textarea>
      </div>
      <ul id="suggest" role="listbox" hidden></ul>
      <div class="bar">
        <button type="button" id="engine" class="pill" data-i18n-label="engine">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span>Google</span>
        </button>
        <button type="submit" class="send" data-i18n-label="searchLabel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </main>

  <div id="hint"></div>
  <script src="i18n.js"></script>
  <script src="fauna.js"></script>
  <script src="app.js"></script>
</body>
</html>
